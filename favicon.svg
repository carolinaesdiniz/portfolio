<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 15 15" shape-rendering="crispEdges" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <style>
    .a { fill: #C2156B; } .i { fill: #1A2422; } .e { fill: none; stroke: #5C6663; stroke-width: 1; }
    @media (prefers-color-scheme: dark) {
      .a { fill: #FF71A8; } .i { fill: #ECEEE9; } .e { stroke: #9AA39F; }
    }
  </style>
  <!-- Carol's personal glyph: 2, 4, 4, 3. Only level 4 rows are accent. -->
  <rect class="i" x="0" y="0" width="3" height="3"/><rect class="i" x="4" y="0" width="3" height="3"/>
  <rect class="e" x="8.5" y="0.5" width="2" height="2"/><rect class="e" x="12.5" y="0.5" width="2" height="2"/>
  <rect class="a" x="0" y="4" width="3" height="3"/><rect class="a" x="4" y="4" width="3" height="3"/>
  <rect class="a" x="8" y="4" width="3" height="3"/><rect class="a" x="12" y="4" width="3" height="3"/>
  <rect class="a" x="0" y="8" width="3" height="3"/><rect class="a" x="4" y="8" width="3" height="3"/>
  <rect class="a" x="8" y="8" width="3" height="3"/><rect class="a" x="12" y="8" width="3" height="3"/>
  <rect class="i" x="0" y="12" width="3" height="3"/><rect class="i" x="4" y="12" width="3" height="3"/>
  <rect class="i" x="8" y="12" width="3" height="3"/><rect class="e" x="12.5" y="12.5" width="2" height="2"/>
</svg>
